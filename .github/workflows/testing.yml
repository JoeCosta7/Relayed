name : Run Tests On Push
on : 
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/Relayed_test
            API_KEY: test-key-not-secret
            ADMIN_API_KEY: admin-test-key-not-secret
            SECRET: test-secret-not-secret
            REDIS_HOST: localhost
            REDIS_PORT: 6379
        services:
            postgres: 
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: Relayed_test
                ports:
                  - 5432:5432
                #Ensures container is ready before job steps begin
                options: >-
                  --health-cmd "pg_isready"
                  --health-interval 10s
                  --health-timeout 5s
                  --health-retries 5  

            redis:
                image: redis:7 #redis version required
                ports:
                  - 6379:6379
                options: >-
                  --health-cmd "redis-cli ping"
                  --health-interval 10s
                  --health-timeout 5s
                  --health-retries 5  
        steps:
        - uses: actions/checkout@v4
          with:
            persist-credentials: false
        - name: Install Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - name: Install dependencies
          run: pip install -r requirements.txt
        - name: Run Tests
          run: pytest tests/ -v
            
